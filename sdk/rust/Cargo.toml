[package]
name = "commmon-rx-sdk"
version = "0.1.0"
edition = "2021"
description = "commmon 데몬 실시간 RX 데이터 수신 SDK"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "monitor"
path = "examples/monitor.rs"
