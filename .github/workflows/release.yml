name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: commmon-windows-x86_64
            binary: commmon.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: commmon-linux-x86_64
            binary: commmon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: commmon-macos-aarch64
            binary: commmon

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Build daemon
        working-directory: commmon
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install MCP server dependencies
        working-directory: mcp-server
        run: npm install --omit=dev --no-audit --no-fund

      - name: Stage release files (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          STAGE="dist/${{ matrix.artifact }}"
          mkdir -p "$STAGE/mcp-server"
          cp commmon/target/${{ matrix.target }}/release/${{ matrix.binary }} "$STAGE/"
          cp mcp-server/package.json mcp-server/index.js "$STAGE/mcp-server/"
          cp -r mcp-server/node_modules "$STAGE/mcp-server/"
          cp install.ps1 install.sh RELEASE_README.md "$STAGE/"

      - name: Stage release files (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          STAGE="dist/${{ matrix.artifact }}"
          mkdir -p "$STAGE/mcp-server"
          cp commmon/target/${{ matrix.target }}/release/${{ matrix.binary }} "$STAGE/"
          chmod +x "$STAGE/${{ matrix.binary }}"
          cp mcp-server/package.json mcp-server/index.js "$STAGE/mcp-server/"
          cp -r mcp-server/node_modules "$STAGE/mcp-server/"
          cp install.ps1 install.sh RELEASE_README.md "$STAGE/"
          chmod +x "$STAGE/install.sh"

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd dist && 7z a -tzip "../${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd dist && tar czf "../${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            commmon-windows-x86_64.zip
            commmon-linux-x86_64.tar.gz
            commmon-macos-aarch64.tar.gz
