name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: commmon-windows-x86_64
            binary: commmon.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: commmon-linux-x86_64
            binary: commmon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: commmon-macos-aarch64
            binary: commmon

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Build
        working-directory: commmon
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist/mcp-server
          cp commmon/target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          cp mcp-server/package.json mcp-server/index.js dist/mcp-server/
          cd dist && 7z a -tzip ../${{ matrix.artifact }}.zip *

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist/mcp-server
          cp commmon/target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          chmod +x dist/${{ matrix.binary }}
          cp mcp-server/package.json mcp-server/index.js dist/mcp-server/
          cd dist && tar czf ../${{ matrix.artifact }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            commmon-windows-x86_64.zip
            commmon-linux-x86_64.tar.gz
            commmon-macos-aarch64.tar.gz
