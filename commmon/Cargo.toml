[package]
name = "commmon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "commmon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-serial = "5"
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
hex = "0.4"
axum = { version = "0.7", features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
rustyline = "15"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
futures = "0.3"
async-stream = "0.3"
