<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serial Monitor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1e1e1e; color: #d4d4d4; font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; height: 100vh; display: flex; flex-direction: column; }
  #toolbar { background: #2d2d2d; padding: 8px 12px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #404040; flex-shrink: 0; }
  #toolbar .status { width: 10px; height: 10px; border-radius: 50%; }
  #toolbar .status.connected { background: #4ec9b0; }
  #toolbar .status.disconnected { background: #f44747; }
  #toolbar span { font-size: 13px; }
  #toolbar button { background: #3c3c3c; color: #d4d4d4; border: 1px solid #555; padding: 4px 12px; border-radius: 3px; cursor: pointer; font-size: 12px; }
  #toolbar button:hover { background: #505050; }
  #toolbar button.active { background: #264f78; border-color: #264f78; }
  #log { flex: 1; overflow-y: auto; padding: 8px 12px; white-space: pre-wrap; word-break: break-all; }
  .line { line-height: 1.6; }
  .ts { color: #608b4e; }
  .port { color: #569cd6; font-weight: bold; }
  .data { color: #d4d4d4; }
  .hex { color: #6a9955; font-size: 12px; }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-track { background: #1e1e1e; }
  #log::-webkit-scrollbar-thumb { background: #424242; border-radius: 4px; }
  .line-count { color: #858585; font-size: 12px; margin-left: auto; }
</style>
</head>
<body>
<div id="toolbar">
  <div class="status disconnected" id="statusDot"></div>
  <span id="statusText">연결 중...</span>
  <button id="btnPause">일시정지</button>
  <button id="btnClear">지우기</button>
  <label style="font-size:12px;display:flex;align-items:center;gap:4px;">
    <input type="checkbox" id="chkHex"> HEX
  </label>
  <span class="line-count" id="lineCount">0 lines</span>
</div>
<div id="log"></div>
<script>
  const log = document.getElementById('log');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const btnPause = document.getElementById('btnPause');
  const btnClear = document.getElementById('btnClear');
  const chkHex = document.getElementById('chkHex');
  const lineCount = document.getElementById('lineCount');
  let paused = false, lines = 0, maxLines = 1000;

  function connect() {
    const es = new EventSource('/events');
    es.onopen = () => {
      statusDot.className = 'status connected';
      statusText.textContent = '연결됨';
    };
    es.onmessage = (e) => {
      if (paused) return;
      const d = JSON.parse(e.data);
      const div = document.createElement('div');
      div.className = 'line';
      let html = '<span class="ts">' + d.timestamp + '</span> <span class="port">[' + d.port + ']</span> <span class="data">' + escHtml(d.ascii) + '</span>';
      if (chkHex.checked) html += ' <span class="hex">[' + d.hex + ']</span>';
      div.innerHTML = html;
      log.appendChild(div);
      lines++;
      while (lines > maxLines) { log.removeChild(log.firstChild); lines--; }
      lineCount.textContent = lines + ' lines';
      log.scrollTop = log.scrollHeight;
    };
    es.onerror = () => {
      statusDot.className = 'status disconnected';
      statusText.textContent = '연결 끊김 — 재연결 중...';
    };
  }

  function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  btnPause.addEventListener('click', () => {
    paused = !paused;
    btnPause.textContent = paused ? '재개' : '일시정지';
    btnPause.classList.toggle('active', paused);
  });
  btnClear.addEventListener('click', () => {
    log.innerHTML = '';
    lines = 0;
    lineCount.textContent = '0 lines';
  });

  connect();
</script>
</body>
</html>
